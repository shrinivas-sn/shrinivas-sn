# Refreshes assets/stats.svg daily from the GitHub API (no third-party service).
# The script fails the run, and leaves the card as it was, when the API does not answer.
name: Refresh stats card
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats-card
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the stats numbers
        run: node .github/scripts/stats-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the card when it changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "stats card unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh stats card" -- assets/stats.svg
          git pull --rebase
          git push
